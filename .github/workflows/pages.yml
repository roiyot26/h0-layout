name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          SITE_BASE: /h0-layout/
      - name: No 3D chunks in the production build
        run: |
          found=$(find dist/assets -type f \( -name 'three-*' -o -name 'world-*' \) | sort)
          if [ -n "$found" ]; then
            echo "3D chunks in the production build (ENABLE_3D must stay off):"
            echo "$found"
            exit 1
          fi
          echo "dist/assets has no three-* or world-* file"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
