name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Install poppler (the PDF scan tests call pdftotext)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: npm test

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        site_base: ['/h0-layout/', '/']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Build with SITE_BASE=${{ matrix.site_base }}
        run: npm run build
        env:
          SITE_BASE: ${{ matrix.site_base }}
      - name: Asset paths use the base
        run: |
          grep -q "src=\"${SITE_BASE}assets/" dist/index.html
        env:
          SITE_BASE: ${{ matrix.site_base }}

  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          SITE_BASE: /h0-layout/
      - name: size-limit
        run: npm run size
      - name: Byte budget
        run: npm run budget

  history:
    runs-on: ubuntu-latest
    steps:
      # Check out the PR head itself, not the merge ref GitHub builds for the run,
      # so only commits that will really be in the history are checked.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with: { node-version: 20 }
      - name: Install poppler (pdftotext for *.pdf scans)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: History check (full history, paths, refs, lockfile)
        run: node scripts/history-check.mjs --all
      - name: Lockfile package names
        run: node scripts/history-check.mjs --text package-lock.json

  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      - name: gitleaks (full history, default rules)
        run: ./gitleaks git --redact --verbose --exit-code 1 .

  glb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: gltf-transform inspect
        run: npx gltf-transform inspect test/fixtures/cube.glb
      - name: meshopt, KTX2 and caps
        run: npm run glb-check

  cv:
    name: cv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Install poppler (pdfinfo, pdftotext)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Verify public/cv.pdf
        run: npm run cv-check
      - name: public/cv.pdf is tagged
        run: |
          pdfinfo public/cv.pdf | grep -q 'Tagged: *yes'

  links:
    name: links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          SITE_BASE: /h0-layout/
      - name: Install e2e deps
        working-directory: e2e
        run: npm ci
      - name: Link check
        working-directory: e2e
        run: npm run links
        env:
          SITE_BASE: /h0-layout/
          DIST_DIR: ${{ github.workspace }}/dist
      - name: No email, mailto or phone in dist
        working-directory: e2e
        run: npm run guard
        env:
          DIST_DIR: ${{ github.workspace }}/dist

  facts:
    name: facts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          SITE_BASE: /h0-layout/
      - name: Install e2e deps
        working-directory: e2e
        run: npm ci
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install chromium --with-deps
      - name: Facts routes (JS off, 1440 and 390)
        working-directory: e2e
        run: npm run facts
        env:
          CI: 'true'
          SITE_BASE: /h0-layout/
          DIST_DIR: ${{ github.workspace }}/dist
          PORT: '4173'

  axe:
    name: axe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          SITE_BASE: /h0-layout/
      - name: Install e2e deps
        working-directory: e2e
        run: npm ci
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install chromium --with-deps
      - name: axe on every route
        working-directory: e2e
        run: npm run axe
        env:
          CI: 'true'
          SITE_BASE: /h0-layout/
          DIST_DIR: ${{ github.workspace }}/dist
          PORT: '4173'
      - name: Smoke (JS on, 1440 and 390)
        working-directory: e2e
        run: npm run smoke
        env:
          CI: 'true'
          SITE_BASE: /h0-layout/
          DIST_DIR: ${{ github.workspace }}/dist
          PORT: '4173'
